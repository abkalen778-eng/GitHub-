<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MiniBrowse">
<title>MiniBrowse</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0b0d12;--card:#141923;--card2:#1a202b;--text:#f4f6f8;--muted:#9aa6b2;--line:#2a3340;--accent:#7c8cff} :root.light{--bg:#eef2f7;--card:#fff;--card2:#f6f8fb;--text:#151a22;--muted:#697586;--line:#dbe1e8;--accent:#5263e8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% -10%,rgba(124,140,255,.22),transparent 35%),var(--bg);color:var(--text);min-height:100vh}.wrap{width:min(980px,calc(100% - 24px));margin:auto;padding:20px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;background:var(--accent);display:grid;place-items:center;font-weight:900;color:white}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px}.hero,.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.2)}.search{display:flex;gap:8px}.search input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:15px;padding:15px;outline:none}.go{border:0;background:var(--accent);color:#fff;font-weight:800;border-radius:14px;padding:0 18px}.options{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:13px}select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:18px}.quick{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:15px;min-height:78px;font-size:18px;font-weight:800}.quick span{display:block;font-size:11px;color:var(--muted);margin-top:6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title h2{font-size:15px;margin:0}.list{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px;min-height:60px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px}.main{flex:1;min-width:0;cursor:pointer}.name{font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.x{border:0;background:transparent;color:var(--muted);font-size:18px}.note{font-size:12px;color:var(--muted);margin:11px 0 0}@media(max-width:720px){.grid{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr}.brand p{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">M</div><div><h1>MiniBrowse</h1><p>Your personal browser hub</p></div></div><button class="btn" id="theme">☾</button></header>
<section class="hero">
<div class="search"><input id="q" placeholder="Search the web or enter a website…" autocomplete="off" autocapitalize="none"><button class="go" id="go">Go</button></div>
<div class="options"><label>Search <select id="engine"><option value="ddg">DuckDuckGo</option><option value="google">Google</option><option value="bing">Bing</option></select></label><label><input type="checkbox" id="private"> Private mode</label></div><p class="note" id="privacy">MiniBrowse history stays only on this device.</p>
</section>
<section class="card" style="margin-top:18px"><div class="title"><h2>Quick links</h2></div><div class="grid"><button class="quick" data-u="https://www.youtube.com">▶<span>YouTube</span></button><button class="quick" data-u="https://github.com">⌘<span>GitHub</span></button><button class="quick" data-u="https://discord.com/app">◈<span>Discord</span></button><button class="quick" data-u="https://www.wikipedia.org">W<span>Wikipedia</span></button><button class="quick" data-u="https://www.reddit.com">r/<span>Reddit</span></button><button class="quick" data-u="https://chatgpt.com">✦<span>ChatGPT</span></button></div></section>
<div class="cols"><section class="card"><div class="title"><h2>Bookmarks</h2><button class="btn" id="add">+ Add</button></div><div class="list" id="bookmarks">No bookmarks yet.</div></section><section class="card"><div class="title"><h2>History</h2><button class="btn" id="clear">Clear</button></div><div class="list" id="history">No history yet.</div></section></div>
</div>
<script>
const $=s=>document.querySelector(s);let b=JSON.parse(localStorage.mb_b||'[]'),h=JSON.parse(localStorage.mb_h||'[]'),priv=localStorage.mb_p==='1',eng=localStorage.mb_e||'ddg',theme=localStorage.mb_t||'dark';const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function target(v){v=v.trim();if(!v)return null;if(/^https?:\/\//i.test(v))return v;if(!v.includes(' ')&&(v.includes('.')||v.startsWith('localhost')))return'https://'+v;const e={ddg:'https://duckduckgo.com/?q=',google:'https://www.google.com/search?q=',bing:'https://www.bing.com/search?q='};return e[eng]+encodeURIComponent(v)}function openIt(v,label){const u=target(v);if(!u)return;if(!priv){h=[{name:label||u,url:u},...h.filter(x=>x.url!==u)].slice(0,30);localStorage.mb_h=JSON.stringify(h);renderH()}location.href=u}function renderB(){const el=$('#bookmarks');if(!b.length){el.textContent='No bookmarks yet.';return}el.innerHTML=b.map((x,i)=>`<div class="item"><div class="main" onclick="openIt('${x.url.replace(/'/g,"\\'")}','${x.name.replace(/'/g,"\\'")}')"><div class="name">${esc(x.name)}</div><div class="url">${esc(x.url)}</div></div><button class="x" onclick="delB(${i})">×</button></div>`).join('')}function delB(i){b.splice(i,1);localStorage.mb_b=JSON.stringify(b);renderB()}function renderH(){const el=$('#history');if(priv){el.textContent='Private mode is on. New visits are not saved.';return}if(!h.length){el.textContent='No history yet.';return}el.innerHTML=h.slice(0,12).map((x,i)=>`<div class="item"><div class="main" onclick="openIt('${x.url.replace(/'/g,"\\'")}','${(x.name||'').replace(/'/g,"\\'")}')"><div class="name">${esc(x.name||x.url)}</div><div class="url">${esc(x.url)}</div></div><button class="x" onclick="delH(${i})">×</button></div>`).join('')}function delH(i){h.splice(i,1);localStorage.mb_h=JSON.stringify(h);renderH()}function setTheme(){document.documentElement.classList.toggle('light',theme==='light');$('#theme').textContent=theme==='light'?'☀':'☾';localStorage.mb_t=theme}$('#go').onclick=()=>openIt($('#q').value);$('#q').onkeydown=e=>{if(e.key==='Enter')openIt($('#q').value)};document.querySelectorAll('[data-u]').forEach(x=>x.onclick=()=>openIt(x.dataset.u,x.innerText.trim()));$('#engine').value=eng;$('#engine').onchange=e=>{eng=e.target.value;localStorage.mb_e=eng};$('#private').checked=priv;$('#private').onchange=e=>{priv=e.target.checked;localStorage.mb_p=priv?'1':'0';$('#privacy').textContent=priv?'Private mode is on. New MiniBrowse visits are not saved.':'MiniBrowse history stays only on this device.';renderH()};$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';setTheme()};$('#add').onclick=()=>{const name=prompt('Bookmark name:');if(!name)return;let url=prompt('Website address:');if(!url)return;if(!/^https?:\/\//i.test(url))url='https://'+url;b.push({name,url});localStorage.mb_b=JSON.stringify(b);renderB()};$('#clear').onclick=()=>{h=[];localStorage.removeItem('mb_h');renderH()};setTheme();renderB();renderH();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script>
</body></html>
